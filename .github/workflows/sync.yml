name: Sync skills

# Pull the skills from a fruxon release on PyPI and commit them when they
# changed. fruxon-sdk's Release workflow fires the `fruxon-released`
# dispatch right after it publishes, so the plugin follows the CLI within
# minutes. The daily run is the fallback for a missed dispatch; run it by
# hand to sync a specific version.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'fruxon version to sync (blank = latest)'
        required: false
        type: string
  repository_dispatch:
    # Sent by fruxon-sdk's Release workflow with client_payload.version.
    types: [fruxon-released]

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Sync from PyPI
        # Through env, not interpolated into the script: the version comes
        # from a dispatch payload or a form field.
        env:
          VERSION: ${{ inputs.version || github.event.client_payload.version }}
        run: python scripts/sync_skills.py $VERSION

      - name: Commit if changed
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Already up to date."
            exit 0
          fi
          version=$(python -c "import json;print(json.load(open('plugins/fruxon/.claude-plugin/plugin.json'))['version'])")
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add plugins/fruxon
          git commit -m "Sync skills from fruxon $version"
          git push
